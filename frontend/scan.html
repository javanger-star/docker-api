<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>バーコードスキャン</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;color:#fff;font-family:sans-serif;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
#cam-wrap{position:relative;flex:1;overflow:hidden;min-height:0}
#video{width:100%;height:100%;object-fit:cover;display:block}
#guide{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:88%;aspect-ratio:6/1;
  border:2px solid #0f0;
  box-shadow:0 0 0 9999px rgba(0,0,0,.55)
}
#guide::before{content:'';position:absolute;top:-3px;left:-3px;width:20px;height:20px;border:3px solid #0f0;border-right:none;border-bottom:none}
#guide::after{content:'';position:absolute;bottom:-3px;right:-3px;width:20px;height:20px;border:3px solid #0f0;border-left:none;border-top:none}
#scan-status{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:13px;color:#0f0;text-shadow:0 1px 3px #000}
#manual{background:#111;padding:12px 14px}
#manual label{display:block;margin-bottom:6px;font-size:13px;color:#aaa}
#input-row{display:flex;gap:8px}
#barcode-input{flex:1;padding:10px;border-radius:8px;border:1px solid #444;background:#222;color:#fff;font-size:17px}
#ok-btn{padding:10px 22px;background:#007bff;color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer}
#ok-btn:active{background:#0056b3}
#err{color:#f55;text-align:center;padding:8px;font-size:13px;min-height:28px}
</style>
</head>
<body>
<div id="cam-wrap">
  <video id="video" autoplay playsinline muted></video>
  <div id="guide"></div>
  <div id="scan-status">カメラ起動中...</div>
</div>

<div id="manual">
  <label>バーコードを手動で入力</label>
  <div id="input-row">
    <input id="barcode-input" type="text" inputmode="numeric" placeholder="バーコード番号を入力">
    <button id="ok-btn">OK</button>
  </div>
</div>
<div id="err"></div>

<script src="https://unpkg.com/@zxing/library@latest/umd/index.min.js"></script>
<script>
const statusEl = document.getElementById('scan-status');
const errEl = document.getElementById('err');
const input = document.getElementById('barcode-input');
let busy = false;

async function checkBarcode(value) {
  value = value.trim();
  if (!value || busy) return;
  busy = true;
  statusEl.textContent = '確認中...';
  errEl.textContent = '';
  try {
    const res = await fetch('/api/barcode/' + encodeURIComponent(value));
    const data = await res.json();
    if (!data.found) {
      errEl.textContent = '登録がありません: ' + value;
      busy = false;
      statusEl.textContent = 'バーコードをガイドに合わせてください';
      return;
    }
    sessionStorage.setItem('barcodeValue', value);
    sessionStorage.setItem('barcodeName', data.name || '');
    sessionStorage.setItem('hasModel', data.has_model ? '1' : '0');
    // モデルを実解像度でプレウォーム（参考画像確認中に完了を目指す）
    fetch('/api/capture/prewarm/' + encodeURIComponent(value)).catch(() => {});
    window.location.href = '/capture';
  } catch (e) {
    errEl.textContent = 'サーバーに接続できません';
    busy = false;
  }
}

const codeReader = new ZXing.BrowserMultiFormatReader();
codeReader.decodeFromVideoDevice(null, 'video', (result, err) => {
  if (result && !busy) {
    statusEl.textContent = '読み取り: ' + result.text;
    checkBarcode(result.text);
  }
}).then(() => {
  statusEl.textContent = 'バーコードをガイドに合わせてください';
}).catch(() => {
  statusEl.textContent = 'カメラを起動できません';
});

document.getElementById('ok-btn').addEventListener('click', () => checkBarcode(input.value));
input.addEventListener('keydown', e => { if (e.key === 'Enter') checkBarcode(input.value); });
</script>
</body>
</html>
