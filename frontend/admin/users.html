<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ユーザー管理</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div id="nav-placeholder"></div>
<div class="container py-4">
  <div class="d-flex align-items-center justify-content-between mb-3">
    <h4 class="mb-0">管理者ユーザー</h4>
    <button class="btn btn-primary" onclick="openNew()">＋ ユーザー追加</button>
  </div>

  <table class="table table-hover align-middle">
    <thead class="table-dark">
      <tr><th>ID</th><th>ユーザー名</th><th>ステータス</th><th>登録日</th><th>操作</th></tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<div class="modal fade" id="modal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modal-title">ユーザー追加</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="modal-err" class="alert alert-danger d-none"></div>
        <form id="modal-form">
          <input type="hidden" id="edit-id">
          <div class="mb-3" id="username-wrap">
            <label class="form-label">ユーザー名 <span class="text-danger">*</span></label>
            <input id="f-username" type="text" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label" id="pw-label">パスワード <span class="text-danger">*</span></label>
            <input id="f-password" type="password" class="form-control">
            <div id="pw-hint" class="form-text d-none">空欄の場合は変更しません</div>
          </div>
          <div class="mb-3" id="active-wrap" style="display:none">
            <div class="form-check">
              <input id="f-active" type="checkbox" class="form-check-input" checked>
              <label class="form-check-label" for="f-active">アクティブ</label>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">キャンセル</button>
        <button class="btn btn-primary" onclick="save()">保存</button>
      </div>
    </div>
  </div>
</div>

<script src="/admin/_common.js?v=3"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.getElementById('nav-placeholder').innerHTML = renderNav('users');
const modal = new bootstrap.Modal(document.getElementById('modal'));
let users = [];
let myId = null;

async function load() {
  [users] = await Promise.all([api('GET', '/admin/users/')]);
  const me = await api('GET', '/auth/me');
  myId = me?.id;
  document.getElementById('tbody').innerHTML = (users || []).map(u => `
    <tr>
      <td>${u.id}</td>
      <td>${u.username}${u.id===myId?' <span class="badge bg-info">自分</span>':''}</td>
      <td><span class="badge bg-${u.is_active?'success':'secondary'}">${u.is_active?'有効':'無効'}</span></td>
      <td>${fmtDate(u.created_at)}</td>
      <td>
        <button class="btn btn-sm btn-outline-primary me-1" onclick="openEdit(${u.id})">編集</button>
        ${u.id!==myId?`<button class="btn btn-sm btn-outline-danger" onclick="remove(${u.id},'${u.username}')">削除</button>`:''}
      </td>
    </tr>`).join('');
}

function openNew() {
  document.getElementById('edit-id').value = '';
  document.getElementById('modal-title').textContent = 'ユーザー追加';
  document.getElementById('modal-form').reset();
  document.getElementById('f-username').disabled = false;
  document.getElementById('username-wrap').style.display = '';
  document.getElementById('pw-label').innerHTML = 'パスワード <span class="text-danger">*</span>';
  document.getElementById('pw-hint').classList.add('d-none');
  document.getElementById('active-wrap').style.display = 'none';
  document.getElementById('modal-err').classList.add('d-none');
  modal.show();
}

function openEdit(id) {
  const u = users.find(x => x.id === id);
  document.getElementById('edit-id').value = id;
  document.getElementById('modal-title').textContent = 'ユーザー編集';
  document.getElementById('f-username').value = u.username;
  document.getElementById('f-username').disabled = true;
  document.getElementById('f-password').value = '';
  document.getElementById('pw-label').textContent = 'パスワード';
  document.getElementById('pw-hint').classList.remove('d-none');
  document.getElementById('f-active').checked = u.is_active;
  document.getElementById('active-wrap').style.display = '';
  document.getElementById('modal-err').classList.add('d-none');
  modal.show();
}

async function save() {
  const errEl = document.getElementById('modal-err');
  errEl.classList.add('d-none');
  const id = document.getElementById('edit-id').value;
  try {
    if (id) {
      const body = {};
      const pw = document.getElementById('f-password').value;
      if (pw) body.password = pw;
      body.is_active = document.getElementById('f-active').checked;
      await api('PUT', '/admin/users/' + id, body);
    } else {
      const pw = document.getElementById('f-password').value;
      if (!pw) { errEl.textContent = 'パスワードを入力してください'; errEl.classList.remove('d-none'); return; }
      await api('POST', '/admin/users/', {
        username: document.getElementById('f-username').value,
        password: pw
      });
    }
    modal.hide();
    load();
  } catch (e) {
    errEl.textContent = e.message;
    errEl.classList.remove('d-none');
  }
}

async function remove(id, name) {
  if (!confirm(`「${name}」を削除しますか？`)) return;
  try { await api('DELETE', '/admin/users/' + id); load(); }
  catch (e) { alert(e.message); }
}

load();
</script>
</body>
</html>
