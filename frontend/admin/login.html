<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理者ログイン</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{background:#f0f2f5;display:flex;align-items:center;justify-content:center;min-height:100vh}
.card{width:100%;max-width:380px}
</style>
</head>
<body>
<div class="card shadow-sm">
  <div class="card-body p-4">
    <h5 class="card-title text-center mb-4">管理者ログイン</h5>
    <div id="err" class="alert alert-danger d-none"></div>
    <form id="login-form">
      <div class="mb-3">
        <label class="form-label">ユーザーID</label>
        <input id="username" type="text" class="form-control" required autofocus>
      </div>
      <div class="mb-4">
        <label class="form-label">パスワード</label>
        <input id="password" type="password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">ログイン</button>
    </form>
  </div>
</div>
<script>
if (localStorage.getItem('token')) window.location.href = '/admin';

document.getElementById('login-form').addEventListener('submit', async e => {
  e.preventDefault();
  const errEl = document.getElementById('err');
  errEl.classList.add('d-none');
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value
      })
    });
    if (!res.ok) {
      const d = await res.json();
      errEl.textContent = d.detail || 'ログインに失敗しました';
      errEl.classList.remove('d-none');
      return;
    }
    const data = await res.json();
    localStorage.setItem('token', data.access_token);
    window.location.href = '/admin';
  } catch {
    errEl.textContent = 'サーバーに接続できません';
    errEl.classList.remove('d-none');
  }
});
</script>
</body>
</html>
